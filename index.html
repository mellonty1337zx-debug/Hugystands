<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Читы на Standoff, PUBG и другие игры</title>
<style>
  :root {
    --bg: #eef1fb;
    --ink: #14183a;
    --muted: #4a5078;
    --accent: #3b3bff;
    --accent-ink: #ffffff;
    --chip: #dfe4fb;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1230;
      --ink: #eef0ff;
      --muted: #a9afdd;
      --accent: #7b7bff;
      --accent-ink: #0f1230;
      --chip: #1d2150;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1230; --ink: #eef0ff; --muted: #a9afdd;
    --accent: #7b7bff; --accent-ink: #0f1230; --chip: #1d2150;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  main { max-width: 640px; width: 100%; }
  h1 {
    font-size: clamp(2.4rem, 9vw, 4.4rem);
    line-height: 1.02;
    margin: 0 0 20px;
    letter-spacing: -0.02em;
  }
  p { font-size: 1.15rem; line-height: 1.5; color: var(--muted); margin: 0 0 28px; max-width: 46ch; }
  .games { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 32px; padding: 0; list-style: none; }
  .games li { background: var(--chip); padding: 8px 16px; border-radius: 999px; font-weight: 600; }
  a.cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, #2aabee, #229ed9 55%, #1b7fc4);
    color: #ffffff;
    text-decoration: none;
    padding: 14px 26px 14px 16px;
    border-radius: 18px;
    box-shadow: 0 10px 28px rgba(34, 158, 217, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.cta:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(34, 158, 217, 0.5); }
  a.cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  a.cta .ico {
    width: 46px; height: 46px; flex: none;
    background: #ffffff; border-radius: 50%;
    display: grid; place-items: center;
  }
  a.cta .ico svg { width: 26px; height: 26px; margin-left: -2px; }
  a.cta .txt { display: flex; flex-direction: column; line-height: 1.2; }
  a.cta .txt b { font-size: 1.2rem; }
  a.cta .txt span { font-size: 0.95rem; opacity: 0.9; }
  @media (prefers-reduced-motion: reduce) { a.cta { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Читы на Standoff, PUBG и другие игры</h1>
  <p>Читы на Standoff, PUBG и т.д. Заходи в наш Telegram-канал.</p>
  <ul class="games">
    <li>Standoff</li>
    <li>PUBG</li>
    <li>и другие</li>
  </ul>
  <a class="cta" href="https://t.me/hugystands" target="_blank" rel="noopener">
    <span class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="#229ed9" d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.4-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.6 13.2 1.9 11.7c-1-.3-1-1 .2-1.5L20.4 3.1c.9-.3 1.6.2 1.5 1.2Z"/></svg>
    </span>
    <span class="txt"><b>Наш Telegram-канал</b><span>@hugystands</span></span>
  </a>
</main>
</body>
</html>
